name: Deploy Supabase Functions

# Deploy Edge Functions when they change on main. Previously these were deployed by hand,
# so a change to the push-delivery function only reached production if someone remembered
# to run `supabase functions deploy`. This closes that gap.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
