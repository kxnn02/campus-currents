name: EAS Build (Android)

# Manual trigger only. App/APK releases are deliberate events and EAS build minutes are
# limited, so we do not build on every push or tag — a maintainer starts a build on demand
# and picks the profile.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-currents-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: campus-currents-app/package-lock.json
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build Android (${{ inputs.profile }})
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
